name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: |
          pnpm --filter @blackbox-protocol/shared typecheck
          pnpm --filter @blackbox-protocol/db typecheck
          pnpm --filter @blackbox-protocol/web typecheck
          pnpm --filter @blackbox-protocol/worker-ingestion typecheck
          pnpm --filter @blackbox-protocol/worker-playback typecheck
          pnpm --filter @blackbox-protocol/worker-alert typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build Web Client
        run: pnpm --filter @blackbox-protocol/web build
