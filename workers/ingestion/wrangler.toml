name = "witness-ingestion"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[r2_buckets]]
binding = "WITNESS_BUCKET"
bucket_name = "witness-chunks"

[[d1_databases]]
binding = "WITNESS_DB"
database_name = "witness-meta"
database_id = "18cd0fd2-458f-41f7-9bda-37616eed6644"

# Secrets to configure via `npx wrangler secret put <KEY>`:
# - AUTH_TOKEN   (Bearer token protecting upload and finalize endpoints)
# - ALERT_SECRET (Shared secret matching ALERT_SECRET in alert worker)

# Service binding for zero-latency worker-to-worker dispatch:
[[services]]
binding = "ALERT_SERVICE"
service = "witness-alert"
